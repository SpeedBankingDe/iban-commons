# Default configuration for the iban-commons-bankdata module, bundled on the classpath.
#
# To override any of these values without waiting for a new library release, copy this file,
# edit only the keys you need to change, and point the module at your copy via the
# de.speedbanking.bankdata.configFile system property (or the IBAN_COMMONS_BANKDATA_CONFIG_FILE
# environment variable). Your copy only needs to contain the keys you actually want to change:
# any key it omits keeps using the value shown below. See BankDataConfig for details.

# cacheDir has no fixed default here: it resolves to ${user.home}/.iban-commons/bankdata at
# runtime, which is specific to the machine running the JVM and cannot be a bundled constant.
# Set it explicitly in your own override file to use a fixed directory instead, e.g.:
# cacheDir = /var/cache/myapp/bankdata

disableNetwork = false
staleThreshold = P90D
connectTimeout = PT5S
readTimeout    = PT30S

loader.AT.url = https://www.oenb.at/docroot/downloads_observ/sepa-zv-vz_gesamt.csv
loader.BE.url = https://www.nbb.be/doc/be/be/protocol/full_list_current.xlsx
loader.CH.url = https://api.six-group.com/api/epcd/bankmaster/v3/bankmaster_V3.csv
loader.CZ.url = https://www.cnb.cz/cs/platebni-styk/.galleries/ucty_kody_bank/download/kody_bank_CR.csv
# the ES and FR loaders both read the ECB's monthly "list of financial institutions" (RIAD_CODE
# is the actual national bank code for these two countries only, see AbstractBankDataLoaderEcb)
# and download this landing page, scraping the current month's CSV link out of it (see
# AbstractBankDataLoaderEcb), rather than pointing directly at the file: the CSV URL carries the
# release month in its filename and would go stale here otherwise
loader.ES.url = https://www.ecb.europa.eu/stats/financial_corporations/list_of_financial_institutions/html/monthly_list-MID.en.html
loader.FR.url = https://www.ecb.europa.eu/stats/financial_corporations/list_of_financial_institutions/html/monthly_list-MID.en.html
# the DE loader downloads this landing page and scrapes the current quarterly release's CSV link
# out of it (see BankDataLoaderDe), rather than pointing directly at the CSV: the CSV URL itself
# rotates every quarter and would go stale here otherwise
loader.DE.url = https://www.bundesbank.de/de/aufgaben/unbarer-zahlungsverkehr/serviceangebot/bankleitzahlen/download-bankleitzahlen-602592
# the NL loader downloads this landing page and scrapes the current XLSX link out of it (see
# BankDataLoaderNl), rather than pointing directly at the file: the XLSX URL carries the upload
# month in its path and would go stale here otherwise
loader.NL.url = https://www.betaalvereniging.nl/kennisbank/iban-en-bic/bic-code/
loader.PL.url = https://ewib.nbp.pl/plewibnra?dokNazwa=plewibnra.txt
