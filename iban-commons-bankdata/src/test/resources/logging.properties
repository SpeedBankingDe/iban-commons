# java.util.logging config used for this module's own tests and the exec-maven-plugin sample/tool
# runs (see pom.xml), so their console output uses CompactLogFormatter's single-line, ISO-8601
# UTC timestamp format instead of java.util.logging.SimpleFormatter's default two-line, locale-
# dependent one. Not shipped in the main artifact; consuming applications configure their own
# java.util.logging setup (or wire up CompactLogFormatter themselves) as they see fit.
handlers = java.util.logging.ConsoleHandler
.level = INFO

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = de.speedbanking.bankdata.log.CompactLogFormatter
