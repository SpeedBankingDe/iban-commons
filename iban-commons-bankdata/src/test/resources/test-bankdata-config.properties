# Test-only override for BankDataConfig, generated via Maven resource filtering (see pom.xml's
# <testResources>). Points the cache directory at a build-local, disposable directory for the
# whole test run instead of the real ${user.home}, keeping tests hermetic (no writes outside
# target/) and deterministic (a fixed, known location CountryDataCacheTest can assert against).
cacheDir = ${project.build.directory}/test-bankdata-cache
