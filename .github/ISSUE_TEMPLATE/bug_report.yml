name: Bug Report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: IBAN Commons version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: >
        A short code snippet (e.g. the IBAN/BIC value that triggers it) and
        the stack trace help a lot — but share whatever you have, even if
        it's incomplete.
    validations:
      required: false
