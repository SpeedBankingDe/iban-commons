name: CodeQL

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master
    schedule:
    -   cron: '30 3 * * 1'
    workflow_dispatch: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    analyze:
        name: Analyze (java-kotlin)
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
        -   uses: actions/checkout@v7

        -   name: Set up JDK 17
            uses: actions/setup-java@v6
            with:
                java-version: '17'
                distribution: 'temurin'
                cache: maven

        -   name: Initialize CodeQL
            uses: github/codeql-action/init@v4
            with:
                languages: java-kotlin
                build-mode: manual

        # Build up to package (not just compile): iban-commons-junit depends on
        # the iban-commons test-jar, which is only attached in the package phase.
        # Skip checkstyle and running the tests, but still compile them so the
        # test-jar gets built.
        -   name: Build for CodeQL analysis
            run: >
                mvn --batch-mode --file pom.xml
                -Dcheckstyle.skip=true
                -DskipTests
                clean package

        -   name: Perform CodeQL Analysis
            uses: github/codeql-action/analyze@v4
            with:
                category: "/language:java-kotlin"
