name: SonarCloud

on:
    push:
        branches:
        - master
    pull_request:
        branches:
        - master
    workflow_dispatch: {}

# cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

# PMD analyzes against the build JDK while the code targets Java 8,
# the compiler's --release already guards the API level.
env:
    PMD_JAVA_DISABLE_AUX_CLASSPATH_WARNINGS: true

jobs:

    build:
        runs-on: ubuntu-latest
        # skip the analysis job on forks, which lack the SONAR_TOKEN secret and access
        # to the speedbankingde SonarCloud organization
        if: ${{ github.repository == 'SpeedBankingDe/iban-commons' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        steps:
        -   uses: actions/checkout@v7
            with:
                # disabling shallow clone is recommended for improving relevancy of reporting
                fetch-depth: 0

        -   name: Set up JDK 21
            uses: actions/setup-java@v6
            with:
                java-version: '21'
                distribution: temurin
                cache: maven

        # the scanner downloads its analyzers on every run unless they are cached
        -   name: Cache SonarQube packages
            uses: actions/cache@v6
            with:
                path: ~/.sonar/cache
                key: ${{ runner.os }}-sonar
                restore-keys: ${{ runner.os }}-sonar

        # the scanner plugin is called by its full coordinates with a fixed version, so the
        # project pom does not need to declare it
        -   name: Build with Maven/JDK 21, test with SonarCloud
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            run: >
                mvn --batch-mode --file pom.xml verify
                org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
                -Dsonar.organization=speedbankingde
                -Dsonar.projectKey=SpeedBankingDe_iban-commons
                -Dsonar.host.url=https://sonarcloud.io
